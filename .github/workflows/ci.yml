name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VIBE_VERIFY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run vibe:codex-wrapper-audit
      - run: npm run vibe:init-shard-audit
      - run: npm run vibe:interview-shard-audit
      - run: npm run vibe:iterate-shard-audit
      - run: npm run vibe:review-shard-audit
      - run: npm run vibe:sprint-mode-audit
      - run: npm run vibe:sync-audit
      - run: npm run build
      - run: npm run vibe:self-test -- --force
      - run: npx playwright install --with-deps chromium
      - run: npm run vibe:test-ui
      - run: npm run vibe:config-audit --silent
  astra:
    runs-on: ubuntu-latest
    env:
      VIBE_ACTIVE_MODEL: gpt-6-astra
      VIBE_VERIFY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run vibe:verify -- --force
  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --require ./.vibe/harness/test/windows-hide-child-process.cjs --import tsx --test .vibe/harness/test/harness-profile.test.ts .vibe/harness/test/run-codex-wrapper.test.ts .vibe/harness/test/windows-hide-child-process.test.ts .vibe/harness/test/shell.test.ts .vibe/harness/test/encoding-settings.test.ts
